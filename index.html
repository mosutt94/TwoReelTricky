<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0a08">
<title>Two Reel Tricky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Limelight&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a08; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #jammed { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; background: #17130d; color: #efe6d0; font-family: "IM Fell English SC", Georgia, serif; text-align: center; }
  #jammed[hidden] { display: none; }
  #jammed b { font-family: Limelight, Georgia, serif; font-weight: normal; font-size: 32px; }
  #jammed small { color: #a39880; font-family: Georgia, serif; font-size: 12px; max-width: 32em; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="jammed" hidden><b>The projector jammed!</b><span>Tap anywhere to start the picture again.</span><small></small></div>
<script>
window.TRT_PRINT = '18';
// Shared setup: the film-frame canvas, tap/swipe input, particles and the old-film overlay.
window.G = (function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const G = {
    canvas, ctx,
    VIEW_H: 360, GROUND: 300,
    INK: '#17130d', PAPER: '#efe6d0', LIGHT: '#d8cdb3', MID: '#a39880', DARK: '#665c4b', SHADOW: '#3b352b',
    TITLE_FONT: 'Limelight, Georgia, serif',
    BODY_FONT: '"IM Fell English SC", Georgia, serif',
    NUM_FONT: '700 {s}px "Playfair Display", Georgia, serif',
    shake: 0,
  };

  // The picture is a fixed-height film frame; its width follows the screen within limits,
  // so a phone held upright gets a letterboxed "movie screen" in the middle.
  const MIN_W = 540, MAX_W = 760;
  function resize() {
    const dpr = G.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    G.scale = Math.min(canvas.height / G.VIEW_H, canvas.width / MIN_W);
    G.viewW = Math.min(canvas.width / G.scale, MAX_W);
    G.offX = (canvas.width - G.viewW * G.scale) / 2;
    G.offY = (canvas.height - G.VIEW_H * G.scale) / 2;
    G.portrait = h > w * 1.1;
  }
  window.addEventListener('resize', resize);
  resize();

  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.rand = (a, b) => a + Math.random() * (b - a);
  G.fmt = (n) => Math.round(n).toLocaleString('en-US');

  G.roundRect = function (x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  // ---- Input. One finger does everything: holding (crouch / grind / manual), letting go (pop),
  // quick flicks (swipes, which re-arm so you can flick again without lifting), and sliding
  // side to side for balance. Keyboard: Space = hold, arrows = swipes and balance.
  const input = { down: false, consumed: false, sx: 0, sy: 0, cx: 0, anchor: 0, t: 0, keyBal: 0 };
  G.input = input;
  G.handlers = { press() {}, release() {}, swipe() {} };

  function press(x, y) {
    input.down = true; input.consumed = false;
    input.sx = input.cx = input.anchor = input.px = x; input.sy = input.py = y;
    input.t = input.st = input.lastMove = performance.now();
    input.fx = (x * G.dpr - G.offX) / G.scale;   // position inside the film frame
    input.fy = (y * G.dpr - G.offY) / G.scale;
    G.handlers.press();
  }
  function release() {
    if (!input.down) return;
    input.down = false;
    if (!input.consumed) G.handlers.release();
  }
  // How far the finger (or arrow keys) is leaning the hero, from -1 to 1.
  G.balanceInput = () => input.keyBal || G.clamp((input.cx - input.anchor) / 45, -1, 1);

  window.addEventListener('pointerdown', (e) => { e.preventDefault(); press(e.clientX, e.clientY); }, { passive: false });
  // A swipe is a quick flick: 22px covered within 180ms of the finger starting to move.
  // Slower slides (balancing on a rail) never count as swipes.
  window.addEventListener('pointermove', (e) => {
    if (!input.down) return;
    const now = performance.now();
    input.cx = e.clientX;
    if (input.consumed) return;
    // After a pause, measure the new movement from where the finger was resting.
    if (now - input.lastMove > 60) { input.sx = input.px; input.sy = input.py; input.st = now - 16; }
    input.lastMove = now;
    input.px = e.clientX; input.py = e.clientY;
    const dx = e.clientX - input.sx, dy = e.clientY - input.sy;
    if (dx * dx + dy * dy > 22 * 22) {
      const quick = now - input.st < 180;
      input.sx = e.clientX; input.sy = e.clientY; input.st = now;
      if (quick) G.handlers.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  const KEY_DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); press(0, 0); }
    else if (KEY_DIRS[e.code]) {
      e.preventDefault();
      if (e.code === 'ArrowLeft') input.keyBal = -1;
      if (e.code === 'ArrowRight') input.keyBal = 1;
      G.handlers.swipe(KEY_DIRS[e.code], true);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') release();
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') input.keyBal = 0;
  });

  // ---- Particles (world coordinates): dust puffs, grind sparks, crate splinters.
  const parts = [];
  G.emit = function (kind, x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      parts.push({
        kind, x, y,
        vx: G.rand(-1, 1) * spread,
        vy: kind === 'spark' ? G.rand(-170, -50) : kind === 'chip' ? G.rand(-320, -120) : G.rand(-35, -5),
        life: 0,
        max: kind === 'spark' ? G.rand(0.15, 0.35) : G.rand(0.45, 0.9),
        r: G.rand(3, 7), rot: G.rand(0, 6), vr: G.rand(-10, 10),
      });
    }
  };
  G.updateParticles = function (dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      if (p.kind !== 'dust') p.vy += 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  };
  G.drawParticles = function (camX) {
    for (const p of parts) {
      const k = 1 - p.life / p.max, x = p.x - camX;
      if (p.kind === 'dust') {
        ctx.fillStyle = 'rgba(163,152,128,' + (0.55 * k) + ')';
        ctx.beginPath(); ctx.arc(x, p.y, p.r * (1.6 - k), 0, 7); ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.strokeStyle = 'rgba(255,252,240,' + k + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else {
        ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = G.DARK; ctx.fillRect(-4, -1.5, 8, 3);
        ctx.restore();
      }
    }
  };

  // ---- Old-film look: grain, flicker, scratches, dust specks, vignette and a weaving gate.
  const grain = [];
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const img = g.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() < 0.5 ? 0 : 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = Math.random() < 0.55 ? 0 : 18 + Math.random() * 40;
    }
    g.putImageData(img, 0, 0);
    grain.push(ctx.createPattern(c, 'repeat'));
  }
  const scratches = [];

  G.beginFrame = function (t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0a08';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const wx = Math.sin(t * 1.7) * 0.4 + (Math.random() - 0.5) * 0.5 + (Math.random() - 0.5) * G.shake;
    const wy = Math.sin(t * 2.3) * 0.3 + (Math.random() - 0.5) * 0.5 + (Math.random() - 0.5) * G.shake;
    ctx.setTransform(G.scale, 0, 0, G.scale, G.offX + wx * G.scale, G.offY + wy * G.scale);
    ctx.save();
    G.roundRect(0, 0, G.viewW, G.VIEW_H, 12);
    ctx.clip();
  };

  G.endFrame = function (t, dt) {
    const W = G.viewW, H = G.VIEW_H;
    G.shake = Math.max(0, G.shake - dt * 30);

    ctx.save();
    ctx.translate(-Math.random() * 128, -Math.random() * 128);
    ctx.fillStyle = grain[(Math.random() * grain.length) | 0];
    ctx.fillRect(0, 0, W + 256, H + 256);
    ctx.restore();

    ctx.fillStyle = Math.random() < 0.5
      ? 'rgba(20,14,6,' + Math.random() * 0.07 + ')'
      : 'rgba(255,248,230,' + Math.random() * 0.05 + ')';
    ctx.fillRect(0, 0, W, H);

    if (Math.random() < 0.03) scratches.push({ x: Math.random() * W, life: G.rand(0.1, 0.7), dark: Math.random() < 0.6 });
    for (let i = scratches.length - 1; i >= 0; i--) {
      const s = scratches[i];
      s.life -= dt;
      if (s.life <= 0) { scratches.splice(i, 1); continue; }
      s.x += G.rand(-1.5, 1.5);
      ctx.strokeStyle = s.dark ? 'rgba(20,14,6,0.35)' : 'rgba(255,250,235,0.45)';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(s.x, 0); ctx.lineTo(s.x + G.rand(-2, 2), H); ctx.stroke();
    }
    if (Math.random() < 0.2) {
      ctx.fillStyle = Math.random() < 0.6 ? 'rgba(20,14,6,0.6)' : 'rgba(255,250,235,0.7)';
      ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, G.rand(0.5, 2.2), 0, 7); ctx.fill();
    }

    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, W * 0.72);
    v.addColorStop(0, 'rgba(10,8,4,0)');
    v.addColorStop(1, 'rgba(10,8,4,0.7)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (G.portrait) {
      ctx.setTransform(G.scale, 0, 0, G.scale, G.offX, G.offY);
      ctx.fillStyle = 'rgba(239,230,208,0.7)';
      ctx.font = '15px ' + G.BODY_FONT;
      ctx.textAlign = 'center';
      ctx.fillText('Turn your phone sideways for the big picture', G.viewW / 2, H + 34);
    }
  };

  return G;
})();

// Sound: Scott Joplin's "The Entertainer" (1902, public domain) on a synthesized upright piano
// in a small picture house, soft projector clatter, and slapstick sound effects. Everything is
// generated with Web Audio from the note data below; nothing is downloaded.
(function () {
  let ac = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('trt-muted') === '1'; } catch (e) { /* storage unavailable */ }

  // ---- The tune. 2/4 time, eight sixteenth-note steps per bar. Each bar is
  // [[first-half chord, second-half chord], melody, flag]. Melody values are MIDI notes;
  // 0 is a rest and _ holds the previous note (across bar lines too). Flags: 'solo' plays the
  // right hand in octaves with no left hand (the introduction); 'oct' doubles the melody an
  // octave below, as Joplin asks on repeats.
  const _ = -1;
  const CH = {   // stride left hand: bass note, alternate bass, chord, and the chord's pitch classes
    C: { root: 36, alt: 43, tones: [52, 55, 60], pcs: [0, 4, 7] },
    G7: { root: 31, alt: 38, tones: [53, 59, 62], pcs: [7, 11, 2, 5] },
    D7: { root: 38, alt: 45, tones: [54, 60, 62], pcs: [2, 6, 9, 0] },
  };
  const A_STRAIN = [
    [['C', 'C'], [76, 84, _, 76, 84, _, 76, 84]],      // E C' . E C' . E C'
    [['C', 'C'], [_, _, _, _, _, 84, 86, 87]],         // (held) C' D' D#'
    [['C', 'G7'], [88, 84, 86, 88, _, 83, 86, 84]],    // E' C' D' E' . B D' C'
    [['C', 'C'], [_, _, _, _, 0, 0, 74, 75]],          // (held) . . D D#
    [['C', 'C'], [76, 84, _, 76, 84, _, 76, 84]],
    [['C', 'C'], [_, _, _, _, _, 81, 79, 78]],         // (held) A G F#
    [['D7', 'D7'], [81, 84, 88, 86, _, 84, 81, 86]],   // A C' E' D' . C' A D'
    [['G7', 'G7'], [_, _, _, _, 0, 0, 74, 75]],
    [['C', 'C'], [76, 84, _, 76, 84, _, 76, 84]],
    [['C', 'C'], [_, _, _, _, _, 84, 86, 87]],
    [['C', 'G7'], [88, 84, 86, 88, _, 83, 86, 84]],
    [['C', 'C'], [_, _, _, _, 0, 0, 74, 75]],
    [['C', 'C'], [76, 84, _, _, _, 84, 86, 88]],       // E C' (held) C' D' E'
    [['C', 'C'], [84, 86, 88, 84, 86, 88, 84, 86]],    // the tumbling figure, three notes against two
    [['C', 'G7'], [88, 84, 86, 88, _, 83, 86, 84]],
    [['C', 'C'], [_, _, _, _, 0, 0, 74, 75]],
  ];
  const INTRO = [
    [['C', 'C'], [74, 76, 72, 69, _, 71, 67, _], 'solo'],   // D E C A . B G, in octaves,
    [['C', 'C'], [62, 64, 60, 57, _, 59, 55, _], 'solo'],   // falling an octave each time
    [['C', 'C'], [50, 52, 48, 45, _, 47, 43, _], 'solo'],
    [['C', 'C'], [43, _, _, _, 0, 0, 74, 75], 'solo'],
  ];
  const SONG = INTRO.concat(A_STRAIN, A_STRAIN.map((b) => [b[0], b[1], 'oct']));
  const LOOP_FROM = INTRO.length;   // after the first time through, the introduction is not repeated
  const LOOP_LEN = SONG.length - LOOP_FROM;

  let bpm = 84, step = 0, nextTime = 0, timer = null, clatterOn = false;
  const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const stepDur = () => 60 / bpm / 4;

  // An upright piano note: a hammer click, then a few slightly stretched partials, the higher
  // ones dying away first. Bass notes ring longer than treble.
  function piano(m, t, dur, vol) {
    const f = freq(m);
    const ring = Math.min(dur, f < 200 ? 2.4 : f < 600 ? 1.6 : 0.9);
    const partials = f > 900 ? [[1, 1], [2.004, 0.18]]
      : f > 350 ? [[1, 1], [2.004, 0.35], [3.012, 0.12]]
        : [[1, 1], [2.004, 0.5], [3.012, 0.25], [4.03, 0.1]];
    const out = ac.createGain();
    out.gain.value = vol;
    out.connect(musicBus);
    partials.forEach(([ratio, lvl], i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * ratio;
      if (i === 0) o.detune.value = 3;
      const tail = ring / (1 + i * 0.9);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(lvl, t + 0.004);
      g.gain.exponentialRampToValueAtTime(lvl * 0.35, t + 0.09 + tail * 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tail);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + tail + 0.02);
    });
    if (f < 900) {                                   // a second, slightly detuned string
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; o.detune.value = -4;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.6, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + ring);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + ring + 0.02);
    }
    noise(t, 0.018, vol * 0.9, 'bandpass', 2600, 1.2, musicBus);   // the hammer
  }

  function noise(t, dur, vol, type, f, q, bus) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const filt = ac.createBiquadFilter();
    filt.type = type; filt.frequency.value = f; filt.Q.value = q || 1;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(bus || sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }

  function bar(i) {
    const n = Math.floor(i / 8);
    return n < SONG.length ? SONG[n] : SONG[LOOP_FROM + (n - LOOP_FROM) % LOOP_LEN];
  }
  const melodyAt = (i) => bar(i)[1][i % 8];

  // A chord tone a third or a sixth below the melody, for the long notes.
  function harmonyBelow(m, chord) {
    for (const gap of [4, 3, 9, 8]) if (chord.pcs.includes(((m - gap) % 12 + 12) % 12)) return m - gap;
    return null;
  }

  function scheduleStep(i, t) {
    const b = bar(i), s = i % 8, flag = b[2];
    const chord = CH[b[0][s < 4 ? 0 : 1]];
    const solo = flag === 'solo';
    if (!solo && s % 4 === 0) piano(s === 0 ? chord.root : chord.alt, t, 1.2, 0.13);      // oom
    if (!solo && s % 4 === 2) chord.tones.forEach((m) => piano(m, t, 0.3, 0.032));         // pah
    const m = b[1][s];
    if (m > 0) {
      let len = 1;
      while (len < 16 && melodyAt(i + len) === _) len++;
      const dur = Math.max(0.35, len * stepDur() * 1.3);
      const vol = s === 0 ? 0.17 : 0.14;
      piano(m, t, dur, vol);
      if (solo) piano(m - 12, t, dur, vol * 0.8);
      else if (flag === 'oct') piano(m - 12, t, dur, vol * 0.55);
      else if (len >= 3) { const h = harmonyBelow(m, chord); if (h) piano(h, t, dur, vol * 0.5); }
    }
  }

  // Schedules well ahead so a busy frame can't make the music stumble, and if the page was
  // throttled it skips forward rather than playing the missed notes in a heap.
  function scheduler() {
    const now = ac.currentTime;
    if (nextTime < now - 0.05) nextTime = now + 0.05;
    while (nextTime < now + 0.6) {
      scheduleStep(step, nextTime);
      if (clatterOn) for (let k = 0; k < 2; k++) noise(nextTime + k * stepDur() / 2, 0.01, 0.01, 'bandpass', 1100, 1.5, musicBus);
      nextTime += stepDur();
      step++;
    }
  }

  // A short, dark room: a decaying burst of noise as the impulse response.
  function makeRoom() {
    const len = Math.floor(ac.sampleRate * 1.3), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const env = Math.pow(1 - i / len, 2.6);
        lp += 0.18 * ((Math.random() * 2 - 1) - lp);      // dull the tail
        d[i] = lp * env;
      }
    }
    const conv = ac.createConvolver();
    conv.buffer = ir;
    return conv;
  }

  G.audio = {
    get muted() { return muted; },
    start() {
      if (!ac) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        ac = new Ctx();
        master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
        const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
        master.connect(lp); lp.connect(hp); hp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
        const room = makeRoom(), wet = ac.createGain(); wet.gain.value = 0.3;
        musicBus.connect(room); room.connect(wet); wet.connect(master);
        sfxBus = ac.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
      }
      if (ac.state === 'suspended') ac.resume();
      if (!timer) { nextTime = ac.currentTime + 0.1; timer = setInterval(scheduler, 100); }
    },
    setTempo(b) { bpm = b; },
    setClatter(on) { clatterOn = on; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('trt-muted', muted ? '1' : '0'); } catch (e) { /* ignore */ }
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.05);
    },
  };

  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else { ac.resume(); nextTime = ac.currentTime + 0.1; }
  });

  G.sfx = function (name) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    if (name === 'ollie') {
      noise(t, 0.05, 0.6, 'bandpass', 1800, 3);
    } else if (name === 'land') {
      noise(t, 0.12, 0.7, 'lowpass', 500, 1);
    } else if (name === 'grind') {
      noise(t, 0.25, 0.25, 'highpass', 4000, 1);
    } else if (name === 'whistleUp' || name === 'whistleDown') {
      const o = ac.createOscillator(), g = ac.createGain();
      const up = name === 'whistleUp';
      o.type = 'sine';
      o.frequency.setValueAtTime(up ? 500 : 1500, t);
      o.frequency.exponentialRampToValueAtTime(up ? 1500 : 260, t + (up ? 0.35 : 0.6));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (up ? 0.4 : 0.7));
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.75);
    } else if (name === 'bail') {
      G.sfx('whistleDown');
      noise(t + 0.3, 0.25, 0.9, 'lowpass', 300, 1);
    } else if (name === 'bank') {
      [72, 76, 79, 84].forEach((m, i) => piano(m, t + i * 0.06, 0.6, 0.14));
    } else if (name === 'whistle') {          // police whistle: a shrill warbling trill
      const o = ac.createOscillator(), lfo = ac.createOscillator(), depth = ac.createGain(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = 2100;
      lfo.frequency.value = 26; depth.gain.value = 140;
      lfo.connect(depth); depth.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
      g.gain.setValueAtTime(0.06, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      o.connect(g); g.connect(sfxBus);
      o.start(t); lfo.start(t); o.stop(t + 0.75); lfo.stop(t + 0.75);
    } else if (name === 'creak') {            // timber groaning before the house goes over
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(90, t); o.frequency.linearRampToValueAtTime(55, t + 0.9);
      f.type = 'lowpass'; f.frequency.value = 600;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
      o.connect(f); f.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t + 1.05);
    } else if (name === 'crash') {
      noise(t, 0.9, 1.0, 'lowpass', 250, 1);
      noise(t + 0.02, 0.5, 0.5, 'bandpass', 1200, 0.8);
      for (let k = 1; k < 6; k++) noise(t + k * 0.07, 0.08, 0.4, 'bandpass', 2000 + k * 300, 3);
    } else if (name === 'tick') {
      noise(t, 0.03, 0.4, 'bandpass', 3000, 4);
    }
  };
})();

// The hero: a slight, stone-faced fellow in a porkpie hat, drawn in the inked rubber-hose manner
// of 1920s cartoons: a big head so the face reads on a phone, a three-quarter face with pie-cut
// eyes under one heavy level brow, a thick even outline and flat fills. Every part is posed from
// the fields skate.js sets (crouch, arms, tilt, board, hat...), so he can skate, flip and flop.
(function () {
  const ctx = G.ctx;
  const SKIN = '#f1e6cf', TROUSERS = '#504739', VEST = '#1d1812', SHIRT = '#f4ecd9', LINE = 1.7;

  // Flat porkpie: wide flat brim, low crown with a telescoped top and a dark ribbon band.
  G.drawHat = function (x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#2a241b'; ctx.strokeStyle = G.INK; ctx.lineWidth = LINE;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(-8.6, -6.6); ctx.quadraticCurveTo(0, -8.2, 8.6, -6.6); ctx.lineTo(9, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = G.INK;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-9, -3.1, 18, 2.4);
    ctx.strokeStyle = 'rgba(239,230,208,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6.5, -5.9); ctx.quadraticCurveTo(0, -7, 6.5, -5.9); ctx.stroke();
    ctx.restore();
  };

  // Board in local space: deck centre at y = -6, wheels touching y = 0.
  function drawBoard(flip, spin, dy) {
    ctx.save();
    ctx.translate(0, -6 + (dy || 0));
    const sy = Math.cos(flip || 0), sx = Math.cos(spin || 0);
    ctx.scale(Math.abs(sx) < 0.05 ? 0.05 : sx, Math.abs(sy) < 0.08 ? 0.08 : sy);
    ctx.fillStyle = G.INK;
    ctx.fillRect(-17, 1.5, 7, 2); ctx.fillRect(10, 1.5, 7, 2);
    for (const wx of [-13.5, 13.5]) {
      ctx.fillStyle = G.INK; ctx.beginPath(); ctx.arc(wx, 4.6, 2.8, 0, 7); ctx.fill();
      ctx.fillStyle = G.MID; ctx.beginPath(); ctx.arc(wx, 4.6, 1, 0, 7); ctx.fill();
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = G.INK; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(-24, -3.5); ctx.lineTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(24, -3.5); ctx.stroke();
    ctx.strokeStyle = sy >= 0 ? '#8a7a5c' : G.LIGHT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-23, -3.2); ctx.lineTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(23, -3.2); ctx.stroke();
    ctx.restore();
  }
  G.drawLooseBoard = function (x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); drawBoard(0, 0, 0); ctx.restore();
  };

  // A soft shadow on whatever he is above, shrinking and fading with height.
  G.drawShadow = function (x, floorY, height) {
    const k = G.clamp(1 - height / 260, 0.25, 1);
    ctx.fillStyle = 'rgba(23,19,13,' + (0.28 * k) + ')';
    ctx.beginPath(); ctx.ellipse(x, floorY + 1, 20 * k + 4, 3.2 * k + 1, 0, 0, Math.PI * 2); ctx.fill();
  };

  // A bendy limb from a through the joint b to c: an ink outline with a flat fill.
  function hose(ax, ay, bx, by, cx, cy, width, color) {
    const qx = 2 * bx - (ax + cx) / 2, qy = 2 * by - (ay + cy) / 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(qx, qy, cx, cy);
    ctx.strokeStyle = G.INK; ctx.lineWidth = width + LINE * 2; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }
  function shoe(fx, fy, lift) {
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(-(lift || 0));
    ctx.fillStyle = G.INK;
    ctx.beginPath();
    ctx.moveTo(-6, -4.5); ctx.lineTo(5, -4.5); ctx.quadraticCurveTo(10.5, -4.5, 10.5, -1.5);
    ctx.quadraticCurveTo(10.5, 0.3, 8, 0.3); ctx.lineTo(-6, 0.3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(239,230,208,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-5, -0.8); ctx.lineTo(8, -0.8); ctx.stroke();
    ctx.restore();
  }
  function leg(fx, fy, hx, hy, bend, lift) {
    const kx = (fx + hx) / 2 + bend, ky = (fy + hy) / 2 + 1;
    hose(hx, hy, kx, ky, fx, fy - 2.5, 7.5, TROUSERS);
    shoe(fx, fy, lift);
  }
  function hand(x, y) {
    ctx.fillStyle = SKIN; ctx.strokeStyle = G.INK; ctx.lineWidth = LINE * 0.85;
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 2.6, y - 2.2, 1.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  function arm(sx, sy, hx, hy, droop) {
    const ex = (sx + hx) / 2 - 1.5, ey = (sy + hy) / 2 + droop;
    hose(sx, sy, ex, ey, hx, hy, 4.4, SHIRT);
    hand(hx, hy);
  }

  // Hand targets (relative to the shoulder) for each arm pose: [backX, backY, frontX, frontY].
  const ARM_POSES = {
    relaxed: [-4, 19, 7, 18],
    out: [-22, 2, 22, -4],
    flail: [-16, -18, 17, -15],
    grab: [-19, -7, 9, 36],
    push: [-13, 15, 13, 9],
  };

  // Draws the hero with feet on the board at (sx, h.y). Reads the pose fields set by skate.js.
  G.drawHero = function (h, sx, t) {
    ctx.save();
    ctx.translate(sx, h.y);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const pushing = h.push >= 0 && h.state === 'ground';
    if (h.state === 'bail') {
      ctx.rotate(h.bailRot);                   // falls flat like a plank, pivoting at the feet
    } else {
      ctx.rotate(h.tilt);
      const fs = h.faceScale === undefined ? 1 : h.faceScale;      // turning round in the half-pipe
      if (fs !== 1) ctx.scale(Math.abs(fs) < 0.06 ? (fs < 0 ? -0.06 : 0.06) : fs, 1);
      if (h.state === 'manual') { ctx.translate(-14, 0); ctx.rotate(-0.24); ctx.translate(14, 0); }
      drawBoard(h.board.flip, h.board.spin, h.board.dy);
    }

    // A touch of squash and stretch, pivoting at the feet.
    const c = h.crouch + (pushing ? 0.3 * Math.sin(h.push * Math.PI) : 0);
    const stretch = h.state === 'air' ? G.clamp(-h.vy / 9000, -0.04, 0.05) : 0;
    const sy = 1 - c * 0.07 + stretch;
    ctx.scale(1 / Math.sqrt(sy), sy);

    const lift = h.board.dy ? -h.board.dy * 0.7 : 0;
    const bob = h.state === 'ground' ? Math.sin(t * 7) * 0.5 : 0;
    const footY = -9 + lift;
    const lean = (h.lean || 0) + (pushing ? 3 * Math.sin(h.push * Math.PI) : 0);
    const hipX = 0, hipY = -37 + c * 12 + lift + bob;
    const bend = 5 + c * 9;

    // Back foot: on the board, or kicking the street when pushing along.
    let bfx = -9, bfy = footY, bfl = 0;
    if (pushing) {
      const p = h.push;
      if (p < 0.25) { bfx = G.lerp(-9, -4, p / 0.25); bfy = G.lerp(footY, 0, p / 0.25); }
      else if (p < 0.7) { bfx = G.lerp(-4, -30, (p - 0.25) / 0.45); bfy = 0; }
      else { const q = (p - 0.7) / 0.3; bfx = G.lerp(-30, -9, q); bfy = G.lerp(0, footY, q) - Math.sin(q * Math.PI) * 6; bfl = Math.sin(q * Math.PI) * 0.5; }
    }

    const shx = hipX + 2.5 + lean, shy = hipY - 19;
    const pose = ARM_POSES[pushing && h.arms === 'relaxed' ? 'push' : h.arms] || ARM_POSES.relaxed;
    const wob = Math.sin(t * (h.arms === 'flail' ? 17 : 6)) * (h.arms === 'relaxed' ? 1.2 : 3) + (h.bal || 0) * 6;
    if (!h.hands) h.hands = pose.slice();
    for (let i = 0; i < 4; i++) h.hands[i] = G.lerp(h.hands[i], pose[i], 0.25);

    // Back to front: far arm, far leg, torso, near leg, head, near arm, hat.
    arm(shx - 2, shy + 4, shx + h.hands[0], shy + h.hands[1] + wob, 3);
    leg(bfx, bfy, hipX - 2, hipY, pushing ? 2 : bend, bfl);

    // Torso: white shirt under a dark waistcoat, with a stiff collar and a bow tie.
    ctx.fillStyle = SHIRT; ctx.strokeStyle = G.INK; ctx.lineWidth = LINE;
    ctx.beginPath();
    ctx.moveTo(hipX - 7.5, hipY + 3); ctx.lineTo(hipX + 7.5, hipY + 3);
    ctx.quadraticCurveTo(shx + 9, hipY - 6, shx + 8.5, shy);
    ctx.lineTo(shx - 8, shy);
    ctx.quadraticCurveTo(hipX - 9, hipY - 6, hipX - 7.5, hipY + 3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = VEST;
    ctx.beginPath();
    ctx.moveTo(hipX - 7, hipY + 2.5); ctx.lineTo(hipX + 7, hipY + 2.5);
    ctx.quadraticCurveTo(shx + 8, hipY - 6, shx + 7.5, shy + 1);
    ctx.lineTo(shx + 4.5, shy + 1); ctx.lineTo(shx + 1.5, shy + 9); ctx.lineTo(shx - 1.5, shy + 1);
    ctx.lineTo(shx - 7.5, shy + 1);
    ctx.quadraticCurveTo(hipX - 8.5, hipY - 6, hipX - 7, hipY + 2.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = G.MID;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(G.lerp(shx + 2.2, hipX + 1.5, (k + 1) / 4), G.lerp(shy + 9, hipY + 2, (k + 1) / 4), 0.9, 0, 7); ctx.fill();
    }

    leg(10, footY, hipX + 2, hipY, bend, 0);

    // Neck, collar and bow tie.
    const hx = shx + 2.5, hy = shy - 13.5;
    ctx.fillStyle = SKIN; ctx.strokeStyle = G.INK; ctx.lineWidth = LINE;
    ctx.fillRect(hx - 4, hy + 6, 7, 8);
    ctx.fillStyle = SHIRT;
    ctx.beginPath(); ctx.moveTo(shx - 5, shy); ctx.lineTo(shx + 5.5, shy); ctx.lineTo(shx + 2.5, shy + 4); ctx.lineTo(shx - 1, shy + 4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    const tw = Math.sin(t * 22) * (h.state === 'air' ? 1 : 0.2);
    ctx.fillStyle = G.INK;
    ctx.beginPath();
    ctx.moveTo(shx + 1, shy + 2); ctx.lineTo(shx - 3, shy + 0.3 + tw); ctx.lineTo(shx - 3, shy + 3.7 + tw);
    ctx.lineTo(shx + 1, shy + 2); ctx.lineTo(shx + 5, shy + 0.3 - tw); ctx.lineTo(shx + 5, shy + 3.7 - tw);
    ctx.closePath(); ctx.fill();

    // Head in three-quarter view: an egg with a small chin, slicked hair at the back, one ear.
    ctx.fillStyle = SKIN; ctx.strokeStyle = G.INK; ctx.lineWidth = LINE;
    ctx.beginPath();
    ctx.moveTo(hx - 9.5, hy - 1);
    ctx.bezierCurveTo(hx - 9.5, hy - 11.5, hx + 9.5, hy - 11.5, hx + 9.8, hy - 1.5);
    ctx.bezierCurveTo(hx + 10, hy + 5, hx + 6, hy + 10.5, hx + 1, hy + 10.5);
    ctx.bezierCurveTo(hx - 5, hy + 10.5, hx - 9.5, hy + 6, hx - 9.5, hy - 1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d1812';                                                      // hair
    ctx.beginPath();
    ctx.moveTo(hx - 9.3, hy - 2);
    ctx.bezierCurveTo(hx - 9.5, hy - 10, hx + 2, hy - 12, hx + 7, hy - 9);
    ctx.lineTo(hx + 7.5, hy - 7.2); ctx.lineTo(hx + 4.5, hy - 8.2);
    ctx.bezierCurveTo(hx, hy - 9.6, hx - 6.5, hy - 8, hx - 7.2, hy - 1.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = SKIN; ctx.strokeStyle = G.INK; ctx.lineWidth = 1.2;                // ear
    ctx.beginPath(); ctx.ellipse(hx - 8.6, hy + 1.2, 2.2, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // The Great Stone Face: two pie-cut eyes, half-lidded, under one heavy level brow; a small
    // nose on the contour; a short straight mouth. He blinks now and then and eyes the hat.
    const blink = (t % 3.7) < 0.12 && h.state !== 'bail';
    const look = h.hatLift > 4 ? -1.3 : 0;
    const eyes = [[hx + 5.6, hy - 0.6, 2.4, 3.1], [hx + 0.4, hy - 0.6, 2, 2.9]];
    for (const [ex, ey, rx, ry] of eyes) {
      if (blink) {
        ctx.strokeStyle = G.INK; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(ex - rx, ey + 0.6); ctx.lineTo(ex + rx, ey + 0.6); ctx.stroke();
        continue;
      }
      ctx.fillStyle = G.INK;
      ctx.beginPath(); ctx.ellipse(ex, ey + look * 0.4, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = SKIN;                                                       // the heavy lid
      ctx.beginPath(); ctx.ellipse(ex, ey - ry - 0.9 + look * 0.4, rx + 1, ry * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbf6ea';                                                  // pie cut
      ctx.beginPath(); ctx.ellipse(ex + rx * 0.4, ey - 0.6 + look * 0.4, 0.8, 1, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = G.INK; ctx.lineWidth = 2.1; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(hx - 2.4, hy - 4.6); ctx.lineTo(hx + 8.6, hy - 4.6); ctx.stroke();
    ctx.lineCap = 'round'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(hx + 9.3, hy + 0.5); ctx.quadraticCurveTo(hx + 12, hy + 2.5, hx + 9.4, hy + 3.6); ctx.stroke();
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(hx + 3, hy + 6.3); ctx.lineTo(hx + 7.6, hy + 6.3); ctx.stroke();

    arm(shx + 2, shy + 4, shx + h.hands[2], shy + h.hands[3] - wob, 2.5);   // near arm, in front

    if (h.hatOn) G.drawHat(hx + 1, hy - 9.6 - h.hatLift, -0.05 + h.hatSpin);
    ctx.restore();
  };

  // Where the hat sits when the hero stands upright (relative to his feet), for the hat-drop gag.
  G.HAT_SPOT = { x: 8, y: -80 };
})();

// The things to skate on and over: rails, benches, ledges, crates, curbs, a loading dock, a
// parked streetcar, kicker ramps, the Thrill Ramp half-pipe and the falling house front.
(function () {
  const ctx = G.ctx, GR = G.GROUND, WALK = GR - 16;

  // ---- Obstacles. Each stands on a base (the street, or the top of something else) and has a top.
  // grind: he can lock onto its top edge; flat: he can ride on top of it; solid: running into
  // its side is a bail.
  G.KINDS = {
    rail: { grind: true, solid: true },
    line: { grind: true },
    bench: { grind: true, flat: true, solid: true },
    ledge: { grind: true, flat: true, solid: true },
    crate: { grind: true, flat: true, solid: true },
    pad: { grind: true, flat: true, solid: true },
    dock: { grind: true, flat: true, solid: true },
    trolley: { grind: true, flat: true, solid: true },
    kicker: { ramp: true },
    slope: { ramp: true },        // a long plank up to a deck; it doesn't launch him
    pipe: {},                     // the half-pipe has its own rules in skate.js
    facade: {},
  };

  const world = G.world = { list: [], nextX: 700, wantFacade: false, wantPipe: false, hints: 0 };
  world.reset = function () {
    world.list.length = 0; world.nextX = 700; world.wantFacade = false; world.wantPipe = false; world.hints = 0;
  };
  function add(kind, x, w, h, variant, base) {
    base = base === undefined ? GR : base;
    const o = { kind, x, w, h, base, top: base - h, variant };
    // Label the first few rails and clotheslines so a new player knows to hold on.
    if ((kind === 'rail' || kind === 'line') && world.hints < 4) { o.hint = true; world.hints++; }
    world.list.push(o);
    return x + w;
  }

  // Lines of obstacles spaced so that a pop off one lands on the next. Each returns where it ends.
  const SECTIONS = [
    (x) => { let e = add('bench', x, 110, 26); e = add('bench', e + 95, 110, 26); return add('bench', e + 95, 110, 26); },
    (x) => add('rail', add('rail', x, 190, 40) + 115, 210, 40),
    (x) => add('rail', add('ledge', x, 170, 30) + 105, 200, 48),
    (x) => { let e = add('kicker', x, 64, 30); e = add('line', e + 50, 250, 104); return add('rail', e + 120, 220, 44); },
    (x) => {                                   // loading dock with a crate and a rail on top, then a bench
      const deck = GR - 44, e = add('dock', x, 400, 44);
      add('crate', x + 110, 30, 30, 'crate', deck);
      add('rail', x + 230, 130, 28, null, deck);
      return add('bench', e + 110, 110, 26);
    },
    (x) => { let e = add('pad', x, 160, 14); e = add('pad', e + 120, 160, 14); return add('pad', e + 120, 160, 14); },
    (x) => add('trolley', add('kicker', x, 64, 30) + 90, 380, 86),
    (x) => add('kicker', x, 70, 34) + 240,     // big air with room to land: try a double or triple
    (x) => { let e = add('crate', x, 30, 30, 'barrel'); e = add('ledge', e + 110, 150, 30); return add('crate', e + 110, 30, 30, 'crate'); },
    (x) => add('bench', add('pad', x, 180, 14) + 100, 110, 26),
  ];
  let lastSection = -1;

  // The Thrill Ramp: a plank slope up to a deck, the half-pipe itself, and a deck on the far side.
  const PIPE_R = 110, PIPE_FLAT = 170;
  function addPipe(x) {
    add('slope', x, 180, PIPE_R);
    add('dock', x + 180, 90, PIPE_R, 'deck');
    const px = x + 270, w = 2 * PIPE_R + PIPE_FLAT;
    world.list.push({ kind: 'pipe', x: px, w, h: PIPE_R, base: GR, top: GR - PIPE_R, R: PIPE_R, F: PIPE_FLAT });
    return add('dock', px + w, 330, PIPE_R, 'deck') + 80;
  }

  G.updateWorld = function (camX) {
    while (world.nextX < camX + G.viewW + 500) {
      let end;
      if (world.wantPipe) {
        world.wantPipe = false;
        end = addPipe(world.nextX + 80);
      } else if (world.wantFacade) {           // a falling house gets the street to itself
        world.wantFacade = false;
        end = add('facade', world.nextX + 260, 170, 200) + 380;
      } else {
        let i;
        do { i = (Math.random() * SECTIONS.length) | 0; } while (i === lastSection);
        lastSection = i;
        end = SECTIONS[i](world.nextX);
      }
      world.nextX = end + (G.clock && G.clock.reel === 2 ? G.rand(200, 320) : G.rand(240, 380));
    }
    while (world.list.length && world.list[0].x + world.list[0].w < camX - 300) world.list.shift();
  };

  function drawObstacle(o, x, t) {
    const top = o.top, w = o.w, base = o.base;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (o.kind === 'bench') {

        g.fillStyle = G.SHADOW; g.fillRect(x + 20, WALK - 50, w - 40, 50);

      } else if (type === 'mailbox') {

        for (let k = -2; k < 8; k++) {

          ctx.beginPath(); ctx.moveTo(x - 5, yy); ctx.lineTo(x + 5, yy - 4); ctx.lineTo(x + 5, yy); ctx.lineTo(x - 5, yy + 4); ctx.fill();

      } else if (type === 'newsstand') {
        ctx.fillStyle = G.DARK; ctx.fillRect(x - 22, y - 30, 44, 30);
        ctx.fillStyle = G.PAPER; for (let k = 0; k < 4; k++) ctx.fillRect(x - 18 + k * 10, y - 26, 7, 9);
        ctx.fillStyle = G.INK; ctx.fillRect(x - 24, y - 34, 48, 5);

  // ---- Pedestrians strolling on the walk, and pigeons on the road that scatter.

  const FOLK = ['lady', 'gent', 'newsboy', 'lady', 'gent', 'granny'];

  G.updateScenery = function (dt, camX, t) {

// ledge to grind it, and let go to pop off. Swipe in the air to flip (swipe the same way again
// for a double or triple), swipe up for the Hat Trick, or swipe up and hold to grab. Land while
// holding to manual. Grinds and manuals need balance: slide the finger to keep the needle up.
(function () {
  const GR = G.GROUND, GRAVITY = 1700;
